<!DOCTYPE html>
<html>
<head>

<body onload="javascript:changeText('esport'), showArticles(getArticles(null));">

<p><a href="#start">Start</a> | <a href="#about">About</a> | <a href="#portfolio">Portfolio</a> | <a href="#categories">Articles</a></p>
</div>

<div class="content">
  <video autoplay muted loop id="videoBG"><source src="./images/bg.mp4" type="video/mp4"></video>
  <h1 class="title"><span></span></h1>
  <p><i>"Nice location for a sick ass quote.." - Dude</i></p>
</div>

<div class="about" id="about">
  <div id="aboutleft" class="aboutleft">
    <div class="aboutbox">
      <p id="aboutlefttext"></p>
    </div>
  </div>
  <div class="aboutright">
    <button onclick="changeText('esport')" class="button button1">ESPORT</button>
    <button onclick="changeText('products')" class="button button2">PRODUCTS</button>
    <button onclick="changeText('development')" class="button button3">DEVELOPMENT</button>
  </div>
</div>

<div class="portfolio" id="portfolio">
  <video autoplay muted loop id="videoBG2"><source src="./images/bg2.mp4" type="video/mp4"></video>

  <div class="portfolioVideos">
    <iframe width="420" height="235" style="border:5px solid #70d6ff" src="https://www.youtube.com/embed/nX6cWacjLZE"></iframe>
    <iframe width="420" height="235" style="border:5px solid #70d6ff" src="https://www.youtube.com/embed/nX6cWacjLZE"></iframe>
    <iframe width="420" height="235" style="border:5px solid #70d6ff" src="https://www.youtube.com/embed/nX6cWacjLZE"></iframe>
    <iframe width="420" height="235" style="border:5px solid #70d6ff" src="https://www.youtube.com/embed/nX6cWacjLZE"></iframe>
  </div>

  <div class="articles" id="categories"></div>
   <h3>Here are some articles</h3>
    <ul id="articlelist"></ul>
    
    <script src="categories.js"></script>
    <script src="articles.js"></script>
    <script>

      const container = document.getElementById("categories");

      // Skapa knappen "Alla"
      const allBtn = document.createElement("button");
      allBtn.textContent = "All";
      allBtn.addEventListener("click", () => {
        showArticles(getArticles(null)); // null fetches all articles
      });
      container.appendChild(allBtn);

      // Skapa knappar för varje kategori
      CATEGORIES.forEach(category => {
        const btn = document.createElement("button");
        btn.textContent = category;
        
        // Vad ska hända när man klickar på knappen?
        // Skriv kod som filtrerar artiklarna på den här kategorin
        btn.addEventListener("click", () => {
          showArticles(getArticles(category));
        });
        container.appendChild(btn);
      });
    </script>



</div>

<div class="footer"><p>Website created by me, Daniel</p></div>
<script type="module" src="./main.js"></script>

</html>
