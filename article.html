<!DOCTYPE html>
<html lang="sv">
<head>
  <link rel="stylesheet" href="article.css">
  <meta charset="UTF-8">
  <title>Articles</title>
</head>
<div class="topmenu">
<p><a href="../portfolio-website/#start">Start</a> | <a href="../portfolio-website/#about">About</a> | <a href="../portfolio-website/#portfolio">Portfolio</a> | <a href="../portfolio-website/#articles">Articles</a></p>
</div>
<body>

<div id="content">Loading...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const article = params.get("id");

  fetch(`articles/${article}.html`)
    .then(res => res.text())
    .then(html => {
      document.getElementById("content").innerHTML = html;
    });
</script>

<div class="footer"><p>Website created by me, Daniel</p></div>
</body>
</html>
